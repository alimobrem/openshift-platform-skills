---
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: production
  namespace: istio-system
spec:
  version: v1.24.3
  profile: openshift
  namespace: istio-system
  values:
    global:
      proxy:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
    meshConfig:
      accessLogFile: /dev/stdout
      defaultConfig:
        tracing:
          sampling: 100
    pilot:
      traceSampling: 100
---
apiVersion: v1
kind: Namespace
metadata:
  name: acme-payments
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: acme-frontend
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: acme-backend
  labels:
    istio-injection: enabled
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
