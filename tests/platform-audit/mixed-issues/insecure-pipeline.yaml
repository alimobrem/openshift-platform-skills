---
# ISSUES:
# - ServiceAccount bound to cluster-admin (overprivileged)
# - No workspace isolation between tasks
# - No dedicated credentials — uses default SA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-sa
  namespace: team-alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipeline-sa-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: pipeline-sa
    namespace: team-alpha
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: insecure-ci
  namespace: team-alpha
spec:
  params:
    - name: repo-url
      type: string
  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.repo-url)

    - name: build
      taskRef:
        name: buildah
        kind: ClusterTask
      runAfter: ["git-clone"]
      params:
        - name: IMAGE
          value: quay.io/team-alpha/app:latest

    - name: deploy
      taskRef:
        name: openshift-client
        kind: ClusterTask
      runAfter: ["build"]
      params:
        - name: SCRIPT
          value: oc rollout restart deployment/app -n team-alpha
