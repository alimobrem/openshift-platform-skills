---
# ISSUES:
# - PeerAuthentication uses PERMISSIVE mode (should be STRICT)
# - Allows plaintext traffic alongside mTLS, defeating zero-trust
# - No AuthorizationPolicy to restrict service-to-service communication
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: basic
  namespace: istio-system
spec:
  version: v1.24.3
  profile: openshift
  namespace: istio-system
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: PERMISSIVE
