---
# ISSUES:
# - Plain-text Secret with hardcoded credentials (should use ESO/ExternalSecret)
# - Password stored in Git (security risk)
# - No rotation mechanism
apiVersion: v1
kind: Secret
metadata:
  name: registry-auth
  namespace: team-gamma
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "quay.io": {
          "username": "robot+team-gamma",
          "password": "SUPER_SECRET_TOKEN_12345",
          "auth": "cm9ib3QrdGVhbS1nYW1tYTpTVVBFUl9TRUNSRVRfVE9LRU5fMTIzNDU="
        }
      }
    }
