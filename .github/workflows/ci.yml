name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 -o /usr/local/bin/yq && \
            chmod +x /usr/local/bin/yq

      - name: Validate JSON files
        run: |
          find . -name '*.json' -not -path './.git/*' | while read f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Validate SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---' || { echo "Missing frontmatter: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Validate test fixture YAML syntax
        run: |
          find tests -name '*.yaml' -o -name '*.yml' | while read f; do
            yq eval '.' "$f" > /dev/null 2>&1 || { echo "Invalid YAML: $f"; exit 1; }
            echo "OK: $f"
          done
