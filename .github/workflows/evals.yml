name: evals
on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to eval'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - platform-engineering
      model:
        description: 'Model to use'
        required: true
        default: 'claude-sonnet-4-6'
        type: choice
        options:
          - claude-opus-4-6
          - claude-sonnet-4-6
          - claude-haiku-4-5

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - skill: platform-engineering
            needs_cluster: false
    steps:
      - name: Filter by input
        id: filter
        env:
          INPUT_SKILL: ${{ inputs.skill }}
          MATRIX_SKILL: ${{ matrix.skill }}
        run: |
          if [ "$INPUT_SKILL" != "all" ] && [ "$INPUT_SKILL" != "$MATRIX_SKILL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.filter.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Install tools
        if: steps.filter.outputs.skip == 'false'
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 -o /usr/local/bin/yq && \
            chmod +x /usr/local/bin/yq

      - name: Install Claude Code
        if: steps.filter.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Run evals
        if: steps.filter.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL: ${{ matrix.skill }}
          MODEL: ${{ inputs.model }}
        run: |
          claude --model "$MODEL" --print --dangerously-skip-permissions \
            "Read skills/$SKILL/evals/evals.json. For each eval:
             1. Spawn a sub-agent that reads skills/$SKILL/SKILL.md first, then answers the eval prompt following the skill workflow.
             2. Score the output against the expectations array.
             Report a scorecard: eval id, expectations passed/total, and any failures." \
            2>&1 | tee "eval-results-${SKILL}.txt"

      - name: Upload results
        if: steps.filter.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.skill }}
          path: eval-results-*.txt
