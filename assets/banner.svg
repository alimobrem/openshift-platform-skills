<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EE0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EE0000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EE0000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="12" fill="url(#bg)"/>

  <!-- Subtle top glow -->
  <rect width="900" height="110" rx="12" fill="url(#glow)"/>

  <!-- Gear/cog icon (platform engineering theme) -->
  <g transform="translate(60, 110)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="52" stroke="#EE0000" stroke-width="3" fill="none" opacity="0.9"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="20" stroke="#EE0000" stroke-width="2.5" fill="none" opacity="0.7"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="6" fill="#EE0000" opacity="0.9"/>
    <!-- 6 gear teeth (rectangles around outer ring) -->
    <rect x="-6" y="-68" width="12" height="20" rx="2" fill="#EE0000" opacity="0.8"/>
    <rect x="-6" y="48" width="12" height="20" rx="2" fill="#EE0000" opacity="0.8"/>
    <g transform="rotate(60)">
      <rect x="-6" y="-68" width="12" height="20" rx="2" fill="#EE0000" opacity="0.8"/>
      <rect x="-6" y="48" width="12" height="20" rx="2" fill="#EE0000" opacity="0.8"/>
    </g>
    <g transform="rotate(120)">
      <rect x="-6" y="-68" width="12" height="20" rx="2" fill="#EE0000" opacity="0.8"/>
      <rect x="-6" y="48" width="12" height="20" rx="2" fill="#EE0000" opacity="0.8"/>
    </g>
    <!-- Spokes connecting inner to outer ring -->
    <line x1="0" y1="-20" x2="0" y2="-52" stroke="#EE0000" stroke-width="2.5" opacity="0.6"/>
    <line x1="0" y1="20" x2="0" y2="52" stroke="#EE0000" stroke-width="2.5" opacity="0.6"/>
    <line x1="17.3" y1="-10" x2="45" y2="-26" stroke="#EE0000" stroke-width="2.5" opacity="0.6"/>
    <line x1="-17.3" y1="10" x2="-45" y2="26" stroke="#EE0000" stroke-width="2.5" opacity="0.6"/>
    <line x1="17.3" y1="10" x2="45" y2="26" stroke="#EE0000" stroke-width="2.5" opacity="0.6"/>
    <line x1="-17.3" y1="-10" x2="-45" y2="-26" stroke="#EE0000" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="145" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#f0f6fc">
    OpenShift Platform Skills
  </text>

  <!-- Subtitle -->
  <text x="145" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#8b949e">
    AI-powered platform engineering for OpenShift
  </text>

  <!-- Skill pills (6) -->
  <g transform="translate(145, 150)">
    <!-- shipwright (orange) -->
    <rect x="0" y="0" width="96" height="28" rx="14" fill="#EF7B4D" opacity="0.15" stroke="#EF7B4D" stroke-width="1" stroke-opacity="0.4"/>
    <text x="48" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EF7B4D" text-anchor="middle">shipwright</text>

    <!-- tekton (blue) -->
    <rect x="108" y="0" width="76" height="28" rx="14" fill="#2B7DE9" opacity="0.15" stroke="#2B7DE9" stroke-width="1" stroke-opacity="0.4"/>
    <text x="146" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B7DE9" text-anchor="middle">tekton</text>

    <!-- istio (purple) -->
    <rect x="196" y="0" width="66" height="28" rx="14" fill="#466BB0" opacity="0.15" stroke="#466BB0" stroke-width="1" stroke-opacity="0.4"/>
    <text x="229" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#466BB0" text-anchor="middle">istio</text>

    <!-- quay (red) -->
    <rect x="274" y="0" width="64" height="28" rx="14" fill="#D71E00" opacity="0.15" stroke="#D71E00" stroke-width="1" stroke-opacity="0.4"/>
    <text x="306" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#D71E00" text-anchor="middle">quay</text>

    <!-- external-secrets (green) -->
    <rect x="350" y="0" width="128" height="28" rx="14" fill="#3FB950" opacity="0.15" stroke="#3FB950" stroke-width="1" stroke-opacity="0.4"/>
    <text x="414" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3FB950" text-anchor="middle">external-secrets</text>

    <!-- dora (teal) -->
    <rect x="490" y="0" width="62" height="28" rx="14" fill="#40C4AA" opacity="0.15" stroke="#40C4AA" stroke-width="1" stroke-opacity="0.4"/>
    <text x="521" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#40C4AA" text-anchor="middle">dora</text>
  </g>

  <!-- Platform badges -->
  <g transform="translate(145, 192)">
    <text font-family="system-ui, sans-serif" font-size="11" fill="#484f58">
      <tspan>Works with</tspan>
    </text>
    <text x="72" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b949e">
      <tspan>Claude Code</tspan>
      <tspan fill="#484f58"> · </tspan>
      <tspan>GitHub Copilot</tspan>
      <tspan fill="#484f58"> · </tspan>
      <tspan>Codex</tspan>
    </text>
  </g>
</svg>
